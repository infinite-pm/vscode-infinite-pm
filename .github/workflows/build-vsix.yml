name: Build vsix

# Reusable: called by ci.yml (on every push/PR) and by release.yml (on a tag).
# Both go through here so the .vsix a release publishes is built exactly the way
# CI proved it builds — the ONLY difference is which ipm-tools ref the bundled
# ipm-rpc server comes from, which the caller passes in.
#
# The extension's palette source of truth and the ipm-rpc server both live in
# the sibling ipm-tools repo, so every job checks it out at ../ipm-tools.

on:
  workflow_call:
    inputs:
      ipm-tools-ref:
        description: 'infinite-pm/ipm-tools ref (branch, tag or SHA) to build ipm-rpc from'
        required: true
        type: string
      retention-days:
        description: 'How long to keep the vsix artifacts'
        required: false
        type: number
        default: 14

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: vscode-ipm }
      - uses: actions/checkout@v4
        with:
          repository: infinite-pm/ipm-tools
          ref: ${{ inputs.ipm-tools-ref }}
          path: ipm-tools
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: vscode-ipm/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version-file: ipm-tools/go.mod }
      - working-directory: vscode-ipm
        run: npm ci
      - working-directory: vscode-ipm
        run: npm run build   # includes gen-palette:check against ../ipm-tools/pkg/ipmtokens/palette.json
      - working-directory: vscode-ipm
        run: npm test

  # One platform-specific .vsix per target, each bundling the matching ipm-rpc
  # under bin/<goos>-<goarch>/ (resolved by the extension's bundled fallback).
  package:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { vsce: linux-x64,     goos: linux,   goarch: amd64 }
          - { vsce: linux-arm64,   goos: linux,   goarch: arm64 }
          - { vsce: linux-armhf,   goos: linux,   goarch: arm, goarm: '7' }
          # Alpine is musl, but CGO_ENABLED=0 makes ipm-rpc a static binary, so
          # the payload matches the glibc build; VS Code still resolves alpine-*
          # as its own target platform, hence separate vsix files.
          - { vsce: alpine-x64,    goos: linux,   goarch: amd64 }
          - { vsce: alpine-arm64,  goos: linux,   goarch: arm64 }
          - { vsce: darwin-x64,    goos: darwin,  goarch: amd64 }
          - { vsce: darwin-arm64,  goos: darwin,  goarch: arm64 }
          - { vsce: win32-x64,     goos: windows, goarch: amd64 }
          - { vsce: win32-arm64,   goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with: { path: vscode-ipm }
      # fetch-depth: 0 so the tag is present locally. The ref is a resolved SHA
      # (release.yml pins one, so all targets bundle the same server), and Go
      # stamps the binary's version from VCS: with a shallow, tagless checkout
      # it can only produce a pseudo-version like v0.0.0-<time>-<sha>, which is
      # what "ipm-rpc --version" then reports. With the tag reachable it stamps
      # the tag. ipm-tools' history is short, so a full fetch costs nothing.
      - uses: actions/checkout@v4
        with:
          repository: infinite-pm/ipm-tools
          ref: ${{ inputs.ipm-tools-ref }}
          path: ipm-tools
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: vscode-ipm/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version-file: ipm-tools/go.mod }
      - working-directory: vscode-ipm
        run: npm ci
      - name: Build ipm-rpc for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          ext=""; [ "$GOOS" = "windows" ] && ext=".exe"
          out="vscode-ipm/bin/${GOOS}-${GOARCH}/ipm-rpc${ext}"
          mkdir -p "$(dirname "$out")"
          go build -C ipm-tools -trimpath -ldflags='-s -w' -o "$(pwd)/$out" ./cmd/ipm-rpc
      - name: Package ${{ matrix.vsce }} .vsix
        working-directory: vscode-ipm
        run: npx vsce package --target ${{ matrix.vsce }}
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.vsce }}
          path: vscode-ipm/*.vsix
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  # The package job never runs what it builds, so a broken cross-build would
  # only surface on a user's machine. Take the SHIPPED artifact — the same vsix
  # a release publishes — unpack the bundled server and start it. Native runners
  # exist only for these two targets; the rest are covered by the build itself.
  smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, vsce: win32-x64,    goos: windows, goarch: amd64 }
          - { os: macos-latest,   vsce: darwin-arm64, goos: darwin,  goarch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix-${{ matrix.vsce }}
          path: vsix
      # A .vsix is a zip. Windows runners have no unzip, macOS has no
      # Expand-Archive, so unpack per OS and share the check below.
      - name: Unpack the vsix (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = Get-ChildItem vsix/*.vsix | Select-Object -First 1
          Copy-Item $pkg vsix/package.zip
          Expand-Archive -Path vsix/package.zip -DestinationPath vsix/unpacked -Force
      - name: Unpack the vsix (macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: unzip -q vsix/*.vsix -d vsix/unpacked
      - name: Run the bundled ipm-rpc --version
        shell: bash
        run: |
          ext=""; [ "${{ matrix.goos }}" = "windows" ] && ext=".exe"
          bin="vsix/unpacked/extension/bin/${{ matrix.goos }}-${{ matrix.goarch }}/ipm-rpc${ext}"
          if [ ! -f "$bin" ]; then
            echo "the vsix does not bundle $bin"; find vsix/unpacked/extension/bin -type f || true; exit 1
          fi
          # Zip round-trips drop the executable bit; the extension chmods at
          # resolution time and so must this check.
          chmod +x "$bin" || true
          "$bin" --version
