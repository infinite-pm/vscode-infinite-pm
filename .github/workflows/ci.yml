name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The build/test/package matrix lives in the reusable build-vsix.yml, shared
  # with release.yml, so what a release ships is built exactly the way CI proves
  # it builds.
  #
  # CI deliberately uses ipm-tools main rather than the pinned ref in
  # .github/ipm-tools.ref: palette drift and server API breaks should surface on
  # the next push, not at release time. Releases pin.
  build:
    uses: ./.github/workflows/build-vsix.yml
    with:
      ipm-tools-ref: main
